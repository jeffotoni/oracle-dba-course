<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de segurança no Oracle</title>
  <desc id="desc">Acesso seguro passa por identidade, autenticação, autorização, objeto e auditoria.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fafb"/><stop offset="1" stop-color="#edf5ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9efff"/><stop offset="1" stop-color="#62d6ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b4f5dc"/><stop offset="1" stop-color="#5be0bd"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd394"/><stop offset="1" stop-color="#ef9b4f"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#b45e14"/></marker>
  </defs>
  <rect width="1200" height="270" rx="24" fill="url(#bg)" stroke="#b8d5df" stroke-width="2"/>
  <text x="38" y="42" fill="#b45e14" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">SEGURANÇA: DO LOGIN À RASTREABILIDADE</text>
  <g fill="none" stroke="#b45e14" stroke-width="4" marker-end="url(#arrow)"><path d="M205 135h25"/><path d="M440 135h25"/><path d="M675 135h25"/><path d="M910 135h25"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="25" y="88" width="180" height="94" rx="16" fill="url(#blue)"/><text x="115" y="125" fill="#073b50" font-size="16" font-weight="700">IDENTIDADE</text><text x="115" y="151" fill="#12546b" font-size="13">usuário</text></g>
    <g><rect x="260" y="88" width="180" height="94" rx="16" fill="url(#green)"/><text x="350" y="125" fill="#073b30" font-size="16" font-weight="700">AUTENTICAÇÃO</text><text x="350" y="151" fill="#0c5c48" font-size="13">senha / método</text></g>
    <g><rect x="495" y="88" width="180" height="94" rx="16" fill="url(#orange)"/><text x="585" y="125" fill="#4b2812" font-size="16" font-weight="700">AUTORIZAÇÃO</text><text x="585" y="151" fill="#633817" font-size="13">roles e grants</text></g>
    <g><rect x="730" y="88" width="180" height="94" rx="16" fill="url(#blue)"/><text x="820" y="125" fill="#073b50" font-size="16" font-weight="700">OBJETO</text><text x="820" y="151" fill="#12546b" font-size="13">tabela / operação</text></g>
    <g><rect x="965" y="88" width="210" height="94" rx="16" fill="url(#green)"/><text x="1070" y="125" fill="#073b30" font-size="16" font-weight="700">AUDITORIA</text><text x="1070" y="151" fill="#0c5c48" font-size="13">evidência da ação</text></g>
  </g>
  <text x="600" y="222" fill="#496879" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">Regra prática: conceder apenas o necessário e registrar o que precisa ser investigado.</text>
</svg>
