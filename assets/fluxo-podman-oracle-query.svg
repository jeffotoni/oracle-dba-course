<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo completo do laboratório Oracle</title>
  <desc id="desc">Fluxo em três níveis: Podman executa o container Oracle, que inicia a instância, o CDB e a PDB. O usuário acessa o schema, a tabela e executa uma query.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f4fafb"/>
      <stop offset="1" stop-color="#fff7ea"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd394"/><stop offset="1" stop-color="#ef9b4f"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9efff"/><stop offset="1" stop-color="#62d6ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b4f5dc"/><stop offset="1" stop-color="#5be0bd"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#087da6"/></marker>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#47758b" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="580" rx="26" fill="url(#background)" stroke="#b8d5df" stroke-width="2"/>
  <text x="40" y="42" fill="#087da6" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">FLUXO COMPLETO DO LABORATÓRIO</text>
  <text x="40" y="70" fill="#496879" font-family="Arial,sans-serif" font-size="14">A infraestrutura dá suporte ao banco; o banco disponibiliza objetos para a aplicação.</text>
  <g font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#087da6" letter-spacing="1">
    <text x="40" y="101">INFRAESTRUTURA</text>
    <text x="40" y="266">BANCO E CONEXÃO</text>
    <text x="40" y="431">OBJETOS E DADOS</text>
  </g>
  <g fill="none" stroke="#087da6" stroke-width="4" marker-end="url(#arrow)">
    <path d="M320 155H440"/>
    <path d="M740 155H860"/>
    <path d="M1020 210V250"/>
    <path d="M880 320H740"/>
    <path d="M460 320H320"/>
    <path d="M180 375V415"/>
    <path d="M320 485H440"/>
    <path d="M740 485H860"/>
  </g>
  <g filter="url(#shadow)" font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="40" y="105" width="280" height="105" rx="16" fill="url(#orange)"/><text x="180" y="150" fill="#4b2812" font-size="20" font-weight="700">PODMAN</text><text x="180" y="177" fill="#633817" font-size="13">executa o ambiente</text><text x="180" y="197" fill="#633817" font-size="12">container runtime</text></g>
    <g><rect x="460" y="105" width="280" height="105" rx="16" fill="url(#cyan)"/><text x="600" y="143" fill="#073b50" font-size="18" font-weight="700">CONTAINER ORACLE</text><text x="600" y="171" fill="#12546b" font-size="13">processo isolado</text><text x="600" y="192" fill="#12546b" font-size="12">imagem + volume + porta</text></g>
    <g><rect x="880" y="105" width="280" height="105" rx="16" fill="url(#green)"/><text x="1020" y="150" fill="#073b30" font-size="19" font-weight="700">INSTÂNCIA</text><text x="1020" y="177" fill="#0c5c48" font-size="13">memória + processos</text><text x="1020" y="197" fill="#0c5c48" font-size="12">Oracle em execução</text></g>
    <g><rect x="880" y="270" width="280" height="105" rx="16" fill="url(#cyan)"/><text x="1020" y="315" fill="#073b50" font-size="21" font-weight="700">CDB</text><text x="1020" y="342" fill="#12546b" font-size="13">container administrativo</text><text x="1020" y="362" fill="#12546b" font-size="12">FREE</text></g>
    <g><rect x="460" y="270" width="280" height="105" rx="16" fill="url(#green)"/><text x="600" y="307" fill="#073b30" font-size="18" font-weight="700">PDB / SERVICE NAME</text><text x="600" y="336" fill="#0c5c48" font-size="13">banco lógico conectável</text><text x="600" y="357" fill="#0c5c48" font-size="12">FREEPDB1</text></g>
    <g><rect x="40" y="270" width="280" height="105" rx="16" fill="url(#orange)"/><text x="180" y="315" fill="#4b2812" font-size="20" font-weight="700">USUÁRIO</text><text x="180" y="342" fill="#633817" font-size="13">login e identidade</text><text x="180" y="362" fill="#633817" font-size="12">SYSTEM ou APP_AULA1</text></g>
    <g><rect x="40" y="435" width="280" height="105" rx="16" fill="url(#cyan)"/><text x="180" y="480" fill="#073b50" font-size="20" font-weight="700">SCHEMA</text><text x="180" y="507" fill="#12546b" font-size="13">objetos do usuário</text><text x="180" y="527" fill="#12546b" font-size="12">APP_AULA1</text></g>
    <g><rect x="460" y="435" width="280" height="105" rx="16" fill="url(#green)"/><text x="600" y="480" fill="#073b30" font-size="20" font-weight="700">TABELA</text><text x="600" y="507" fill="#0c5c48" font-size="13">linhas e colunas</text><text x="600" y="527" fill="#0c5c48" font-size="12">AMBIENTE_AULA1</text></g>
    <g><rect x="880" y="435" width="280" height="105" rx="16" fill="url(#orange)"/><text x="1020" y="480" fill="#4b2812" font-size="20" font-weight="700">QUERY</text><text x="1020" y="507" fill="#633817" font-size="13">SELECT e resultado</text><text x="1020" y="527" fill="#633817" font-size="12">dados observáveis</text></g>
  </g>
</svg>
