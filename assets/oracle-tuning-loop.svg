<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de tuning orientado por evidências</title>
  <desc id="desc">O tuning Oracle segue observar, medir, formular hipótese, intervir e validar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fafb"/><stop offset="1" stop-color="#fff7ea"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9efff"/><stop offset="1" stop-color="#62d6ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b4f5dc"/><stop offset="1" stop-color="#5be0bd"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd394"/><stop offset="1" stop-color="#ef9b4f"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#087da6"/></marker>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)" stroke="#b8d5df" stroke-width="2"/>
  <text x="38" y="42" fill="#087da6" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">TUNING ORIENTADO POR EVIDÊNCIAS</text>
  <g fill="none" stroke="#087da6" stroke-width="4" marker-end="url(#arrow)"><path d="M195 138h25"/><path d="M390 138h25"/><path d="M585 138h25"/><path d="M780 138h25"/><path d="M975 138h25"/></g>
  <path d="M1080 190c-40 48-160 50-205 10" fill="none" stroke="#b45e14" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="25" y="88" width="170" height="96" rx="16" fill="url(#blue)"/><text x="110" y="127" fill="#073b50" font-size="17" font-weight="700">OBSERVAR</text><text x="110" y="153" fill="#12546b" font-size="13">alerta e sintoma</text></g>
    <g><rect x="220" y="88" width="170" height="96" rx="16" fill="url(#green)"/><text x="305" y="127" fill="#073b30" font-size="17" font-weight="700">MEDIR</text><text x="305" y="153" fill="#0c5c48" font-size="13">métrica e plano</text></g>
    <g><rect x="415" y="88" width="170" height="96" rx="16" fill="url(#orange)"/><text x="500" y="127" fill="#4b2812" font-size="17" font-weight="700">HIPÓTESE</text><text x="500" y="153" fill="#633817" font-size="13">causa provável</text></g>
    <g><rect x="610" y="88" width="170" height="96" rx="16" fill="url(#green)"/><text x="695" y="127" fill="#073b30" font-size="17" font-weight="700">INTERVIR</text><text x="695" y="153" fill="#0c5c48" font-size="13">mudança controlada</text></g>
    <g><rect x="805" y="88" width="170" height="96" rx="16" fill="url(#blue)"/><text x="890" y="127" fill="#073b50" font-size="17" font-weight="700">VALIDAR</text><text x="890" y="153" fill="#12546b" font-size="13">medir o efeito</text></g>
  </g>
  <text x="600" y="235" fill="#496879" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">Tuning não é palpite: é hipótese, mudança e evidência.</text>
</svg>
