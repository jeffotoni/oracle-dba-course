<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Componentes da instância Oracle</title>
  <desc id="desc">A instância Oracle combina memória e processos para operar os arquivos do banco.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fafb"/><stop offset="1" stop-color="#fff7ea"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9efff"/><stop offset="1" stop-color="#62d6ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b4f5dc"/><stop offset="1" stop-color="#5be0bd"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd394"/><stop offset="1" stop-color="#ef9b4f"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#087da6"/></marker>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)" stroke="#b8d5df" stroke-width="2"/>
  <text x="38" y="42" fill="#087da6" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">INSTÂNCIA ORACLE</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="45" y="88" width="300" height="120" rx="18" fill="url(#blue)"/><text x="195" y="128" fill="#073b50" font-size="20" font-weight="700">MEMÓRIA</text><text x="195" y="157" fill="#12546b" font-size="14">SGA · PGA</text><text x="195" y="181" fill="#12546b" font-size="12">cache e áreas de trabalho</text></g>
    <g><rect x="450" y="88" width="300" height="120" rx="18" fill="url(#green)"/><text x="600" y="128" fill="#073b30" font-size="20" font-weight="700">PROCESSOS</text><text x="600" y="157" fill="#0c5c48" font-size="14">background · servidor</text><text x="600" y="181" fill="#0c5c48" font-size="12">execução e coordenação</text></g>
    <g><rect x="855" y="88" width="300" height="120" rx="18" fill="url(#orange)"/><text x="1005" y="128" fill="#4b2812" font-size="20" font-weight="700">ARQUIVOS</text><text x="1005" y="157" fill="#633817" font-size="14">datafiles · redo · control</text><text x="1005" y="181" fill="#633817" font-size="12">persistência no armazenamento</text></g>
  </g>
  <g fill="none" stroke="#087da6" stroke-width="4" marker-end="url(#arrow)"><path d="M345 148h95"/><path d="M750 148h95"/></g>
  <text x="600" y="252" fill="#496879" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">Instância = memória + processos; banco = arquivos persistentes.</text>
</svg>
