<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Evolução do Oracle para multitenant e cloud</title>
  <desc id="desc">A arquitetura evolui de banco local para CDB e PDB, DBaaS e serviços autônomos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fafb"/><stop offset="1" stop-color="#edf5ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9efff"/><stop offset="1" stop-color="#62d6ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b4f5dc"/><stop offset="1" stop-color="#5be0bd"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd394"/><stop offset="1" stop-color="#ef9b4f"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#b45e14"/></marker>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)" stroke="#b8d5df" stroke-width="2"/>
  <text x="38" y="42" fill="#b45e14" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">ORACLE: MULTITENANT E CLOUD</text>
  <g fill="none" stroke="#b45e14" stroke-width="4" marker-end="url(#arrow)"><path d="M275 138h45"/><path d="M585 138h45"/><path d="M895 138h45"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="45" y="88" width="230" height="105" rx="16" fill="url(#orange)"/><text x="160" y="126" fill="#4b2812" font-size="18" font-weight="700">LOCAL</text><text x="160" y="153" fill="#633817" font-size="13">servidor e arquivos</text><text x="160" y="174" fill="#633817" font-size="12">controle direto</text></g>
    <g><rect x="320" y="88" width="265" height="105" rx="16" fill="url(#blue)"/><text x="452" y="126" fill="#073b50" font-size="18" font-weight="700">MULTITENANT</text><text x="452" y="153" fill="#12546b" font-size="13">CDB + PDBs</text><text x="452" y="174" fill="#12546b" font-size="12">consolidação</text></g>
    <g><rect x="630" y="88" width="265" height="105" rx="16" fill="url(#green)"/><text x="762" y="126" fill="#073b30" font-size="18" font-weight="700">DBaaS / OCI</text><text x="762" y="153" fill="#0c5c48" font-size="13">serviço gerenciado</text><text x="762" y="174" fill="#0c5c48" font-size="12">elasticidade</text></g>
    <g><rect x="940" y="88" width="215" height="105" rx="16" fill="url(#blue)"/><text x="1047" y="126" fill="#073b50" font-size="18" font-weight="700">AUTONOMOUS</text><text x="1047" y="153" fill="#12546b" font-size="13">automação</text><text x="1047" y="174" fill="#12546b" font-size="12">governança</text></g>
  </g>
  <text x="600" y="240" fill="#496879" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">A infraestrutura muda; fundamentos como segurança, dados, backup e operação continuam.</text>
</svg>
