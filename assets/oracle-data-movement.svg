<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Ferramentas de movimentação de dados Oracle</title>
  <desc id="desc">CSV, arquivos externos e dumps entram no Oracle por SQL*Loader, tabelas externas ou Data Pump.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fafb"/><stop offset="1" stop-color="#fff7ea"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9efff"/><stop offset="1" stop-color="#62d6ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b4f5dc"/><stop offset="1" stop-color="#5be0bd"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd394"/><stop offset="1" stop-color="#ef9b4f"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#087da6"/></marker>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)" stroke="#b8d5df" stroke-width="2"/>
  <text x="38" y="42" fill="#087da6" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">MOVIMENTAÇÃO DE DADOS EM VOLUME</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="55" y="78" width="220" height="72" rx="14" fill="url(#orange)"/><text x="165" y="108" fill="#4b2812" font-size="16" font-weight="700">CSV / ARQUIVO</text><text x="165" y="132" fill="#633817" font-size="13">dados externos</text></g>
    <g><rect x="490" y="78" width="220" height="72" rx="14" fill="url(#blue)"/><text x="600" y="108" fill="#073b50" font-size="16" font-weight="700">ORACLE</text><text x="600" y="132" fill="#12546b" font-size="13">ferramenta nativa</text></g>
    <g><rect x="925" y="78" width="220" height="72" rx="14" fill="url(#green)"/><text x="1035" y="108" fill="#073b30" font-size="16" font-weight="700">TABELA / SCHEMA</text><text x="1035" y="132" fill="#0c5c48" font-size="13">dados disponíveis</text></g>
    <g><rect x="70" y="210" width="300" height="64" rx="14" fill="url(#blue)"/><text x="220" y="238" fill="#073b50" font-size="15" font-weight="700">SQL*LOADER</text><text x="220" y="258" fill="#12546b" font-size="12">carga de registros</text></g>
    <g><rect x="450" y="210" width="300" height="64" rx="14" fill="url(#green)"/><text x="600" y="238" fill="#073b30" font-size="15" font-weight="700">TABELA EXTERNA</text><text x="600" y="258" fill="#0c5c48" font-size="12">consulta sem importar</text></g>
    <g><rect x="830" y="210" width="300" height="64" rx="14" fill="url(#orange)"/><text x="980" y="238" fill="#4b2812" font-size="15" font-weight="700">DATA PUMP</text><text x="980" y="258" fill="#633817" font-size="12">schema e objetos</text></g>
  </g>
  <g fill="none" stroke="#087da6" stroke-width="4" marker-end="url(#arrow)"><path d="M275 114h200"/><path d="M710 114h200"/><path d="M165 150v45"/><path d="M600 150v45"/><path d="M1035 150v45"/></g>
</svg>
