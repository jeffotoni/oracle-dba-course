<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Evolução dos modelos de dados</title>
  <desc id="desc">Linha evolutiva de arquivos isolados até modelos relacionais, NoSQL, vetoriais e cloud.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fafb"/><stop offset="1" stop-color="#fff7ea"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd18e"/><stop offset="1" stop-color="#ef9b4f"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5edff"/><stop offset="1" stop-color="#62d6ff"/></linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a6f6d7"/><stop offset="1" stop-color="#5be0bd"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#b45e14"/></marker>
  </defs>
  <rect width="1200" height="260" rx="24" fill="url(#bg)" stroke="#b8d5df" stroke-width="2"/>
  <text x="38" y="42" fill="#b45e14" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">EVOLUÇÃO DOS MODELOS DE DADOS</text>
  <g fill="none" stroke="#b45e14" stroke-width="4" marker-end="url(#arrow)"><path d="M215 137h25"/><path d="M450 137h25"/><path d="M685 137h25"/><path d="M920 137h25"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="25" y="88" width="190" height="98" rx="16" fill="url(#a)"/><text x="120" y="125" fill="#4b2812" font-size="16" font-weight="700">ARQUIVOS</text><text x="120" y="151" fill="#633817" font-size="13">isolados</text><text x="120" y="171" fill="#633817" font-size="12">redundância</text></g>
    <g><rect x="260" y="88" width="190" height="98" rx="16" fill="url(#b)"/><text x="355" y="125" fill="#083b4e" font-size="16" font-weight="700">HIERÁRQUICO</text><text x="355" y="151" fill="#12546b" font-size="13">árvore rígida</text><text x="355" y="171" fill="#12546b" font-size="12">navegação</text></g>
    <g><rect x="495" y="88" width="190" height="98" rx="16" fill="url(#c)"/><text x="590" y="125" fill="#084536" font-size="16" font-weight="700">RELACIONAL</text><text x="590" y="151" fill="#0c5c48" font-size="13">tabelas + SQL</text><text x="590" y="171" fill="#0c5c48" font-size="12">integridade</text></g>
    <g><rect x="730" y="88" width="190" height="98" rx="16" fill="url(#b)"/><text x="825" y="125" fill="#083b4e" font-size="16" font-weight="700">NOSQL</text><text x="825" y="151" fill="#12546b" font-size="13">escala e flexibilidade</text><text x="825" y="171" fill="#12546b" font-size="12">novos workloads</text></g>
    <g><rect x="965" y="88" width="210" height="98" rx="16" fill="url(#a)"/><text x="1070" y="120" fill="#4b2812" font-size="16" font-weight="700">VETORIAL</text><text x="1070" y="145" fill="#633817" font-size="13">IA, busca semântica</text><text x="1070" y="168" fill="#633817" font-size="12">cloud e dados híbridos</text></g>
  </g>
  <text x="600" y="225" fill="#496879" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">Novos modelos complementam o relacional; não eliminam sua importância.</text>
</svg>
